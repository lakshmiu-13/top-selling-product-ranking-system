services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092; exec 3>&-; exec 3<&-'
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    restart: unless-stopped

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      CLUSTER_NAME: sellpulse
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_namenode_name_dir: file:///hadoop/dfs/name
    ports:
      - "${NAMENODE_HOST_PORT:-9870}:9870"
    volumes:
      - namenode-data:/hadoop/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfs -ls / >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - datanode-data:/hadoop/dfs/data
    healthcheck:
      test:
        - CMD-SHELL
        - hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (1)'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      target: pipeline
    command: ["/bin/bash", "/app/scheduler/run-pipeline.sh"]
    init: true
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      MAPRED_CONF_mapreduce_framework_name: local
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: sales-transactions
      SALES_DATASET: ${SALES_DATASET:-instacart}
      SALES_CSV: /app/data/sales.csv
      INSTACART_PRODUCTS_CSV: /app/data/instacart/products.csv/products.csv
      INSTACART_ORDER_PRODUCTS_CSV: /app/data/instacart/order_products__prior.csv/order_products__prior.csv
      INSTACART_MAX_EVENTS: ${INSTACART_MAX_EVENTS:-100}
      INSTACART_REPLAY_DELAY_SECONDS: ${INSTACART_REPLAY_DELAY_SECONDS:-0.5}
      HDFS_URL: http://namenode:9870
      HDFS_INPUT_DIR: /sales/input
      HADOOP_HOME: /opt/hadoop-3.2.1
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-600}
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    ports:
      - "${DASHBOARD_PORT:-8502}:8501"
    volumes:
      - ./results:/app/results:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  kafka-data:
  namenode-data:
  datanode-data:
